# Общий конфиг режима компенсации убытков (recovery mode)
# Применяется ко всем ботам одновременно через API сервер

recovery_enabled: false
recovery_bonus_pct: 50
recovery_max_pct: 50

# Пауза на портфель целиком (глобальная, через API-сервер)
max_positions: 100000          # Максимум одновременно открытых позиций по всем символам
loss_streak_trigger: 100000    # Число убытков подряд для паузы (100000 = отключено; 0 НЕ работает — сервер падает в дефолт 2)
loss_pause_signals: 0          # Сколько сигналов пропустить (не используется, т.к. триггер отключён)

# Автосброс паузы/счётчика убытков по времени (минуты). Если после последнего
# события (убытка/включения паузы) прошло >= этого времени без новых сделок —
# пауза и счётчик подряд убытков сбрасываются, чтобы не "зависать" в тишине.
# 0 = отключено.
pause_timeout_minutes: 120

# Потолок долга recovery (USDT). Если сумма всех free+locked цепочек >= значения,
# claim() возвращает отказ — новые recovery-позиции не открываются, пока долг не снизится.
max_free_debt_usd: 15.0

# Дневной лимит убытков (USDT). Если сумма убыточных закрытий за текущий UTC-день
# достигла порога — боты прекращают новые входы до конца дня (daily pause).
# 100000 = отключено (0 НЕ работает — сервер падает в дефолт 8.0).
daily_loss_limit_usd: 100000
